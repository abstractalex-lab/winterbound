name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # No GEMINI_API_KEY is configured here, so the tests that need one are
      # skipped. This is deliberate: it proves the project builds and passes
      # on a clean clone with no secrets.
      - name: Build and test
        run: mvn --batch-mode verify
